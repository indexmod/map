name: Deploy map

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: map-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Worker syntax
        run: node --check worker/index.js
      - name: Install Wrangler
        run: npm install --no-save --no-package-lock wrangler@4.131.2
      - name: Find or create dedicated KV namespace
        run: node scripts/prepare-kv.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Configure analyzer secrets
        run: |
          test -n "$HF_TOKEN"
          test -n "$MAP_ANALYZER_TOKEN"
          printf '%s' "$HF_TOKEN" | npx wrangler secret put HF_TOKEN
          printf '%s' "$MAP_ANALYZER_TOKEN" | npx wrangler secret put MAP_ANALYZER_TOKEN
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MAP_ANALYZER_TOKEN: ${{ secrets.MAP_ANALYZER_TOKEN }}
      - name: Deploy Worker and custom domain
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Place published articles with Qwen once
        run: node scripts/apply-published.mjs
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
